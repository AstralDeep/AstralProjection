<!DOCTYPE html>
<!--
  Web console shell template: the host fills its %%ASTRAL_*%% nonce, token and asset-version
  placeholders and console_model.py its %%CONSOLE:*%% labels; client.js drives it and astral.css lays it out.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AstralDeep</title>
  <link rel="manifest" href="/static/manifest.webmanifest?v=%%ASTRAL_V:manifest.webmanifest%%">
  <script defer src="/static/offline-registration.js?v=%%ASTRAL_V:offline-registration.js%%"></script>
  <link rel="icon" type="image/png" href="/static/img/astra-fav.png?v=%%ASTRAL_V:img/astra-fav.png%%">
  <link rel="apple-touch-icon" href="/static/img/astra-fav.png?v=%%ASTRAL_V:img/astra-fav.png%%">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/open-sans-latin.woff2?v=%%ASTRAL_V:fonts/open-sans-latin.woff2%%">
  <link rel="stylesheet" href="/static/astral.css?v=%%ASTRAL_V:astral.css%%">
  <script nonce="%%ASTRAL_NONCE%%">
    window.__ASTRAL_TOKEN__ = "%%ASTRAL_TOKEN%%"; window.__ASTRAL_RESUMED__ = %%ASTRAL_RESUMED%%;
    window.__ASTRAL_PLOTLY_URL__ = "/static/vendor/plotly.min.js?v=%%ASTRAL_V:vendor/plotly.min.js%%";
    window.__ASTRAL_LIVEKIT_URL__ = "/static/vendor/livekit-client.umd.min.js?v=%%ASTRAL_V:vendor/livekit-client.umd.min.js%%";
    window.__ASTRAL_LANDING__ = %%ASTRAL_LANDING%%;
  </script>
  <script src="/static/vendor/tailwind.js?v=%%ASTRAL_V:vendor/tailwind.js%%"></script>
  <script nonce="%%ASTRAL_NONCE%%">
    // astral-* utilities read the runtime CSS variables so theme_apply can restyle them live
    tailwind.config = {
      theme: { extend: {
        colors: {
          'astral-bg': 'rgb(var(--astral-bg) / <alpha-value>)',
          'astral-surface': 'rgb(var(--astral-surface) / <alpha-value>)',
          'astral-primary': 'rgb(var(--astral-primary) / <alpha-value>)',
          'astral-secondary': 'rgb(var(--astral-secondary) / <alpha-value>)',
          'astral-text': 'rgb(var(--astral-text) / <alpha-value>)',
          'astral-muted': 'rgb(var(--astral-muted) / <alpha-value>)',
          'astral-accent': 'rgb(var(--astral-accent) / <alpha-value>)',
        },
        fontFamily: { sans: ['Open Sans', 'system-ui', 'sans-serif'], mono: ['Open Sans', 'system-ui', 'sans-serif'] },
      } },
    };
  </script>
</head>
<body class="bg-astral-bg text-astral-text" data-astral-view="start">
  <div class="astral-app">
    <button type="button" id="astral-drawer-toggle" class="astral-drawer-toggle"
            aria-expanded="false" aria-controls="astral-sidebar"
            aria-label="Show the agent directory" title="Show the agent directory">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
    </button>
    <div id="astral-drawer-backdrop" class="astral-drawer-backdrop" hidden></div>

    <aside id="astral-sidebar" class="astral-sidebar" aria-label="Agent directory and account">
      <button type="button" id="astral-brand" class="astral-brand" data-tour-target="topbar.brand"
              aria-label="Return to the dashboard" title="Return to the dashboard">
        <img src="/static/img/AstralDeep.png?v=%%ASTRAL_V:img/AstralDeep.png%%" alt="AstralDeep" class="astral-brand-logo" draggable="false">
      </button>

      <section id="astral-recent-work" class="astral-recent">
        <button type="button" id="astral-recent-toggle" class="astral-recent-toggle"
                aria-expanded="true" aria-controls="astral-history">
          <span class="astral-recent-title">%%CONSOLE:history%%</span>
          <svg class="astral-recent-chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <div id="astral-history" class="astral-history-region"></div>
      </section>

      <div id="astral-dir-head" class="astral-dir-head">
        <span class="astral-dir-title">%%CONSOLE:agent_directory%%</span>
        <span id="astral-agent-count" class="astral-agent-count" role="status" aria-live="polite">0</span>
      </div>

      <div class="astral-search-box">
        <svg class="astral-search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
        <input type="search" id="astral-agent-search" class="astral-search-input"
               placeholder="%%CONSOLE:search_agents%%" aria-label="%%CONSOLE:search_agents%%"
               aria-controls="astral-agent-list" autocomplete="off">
      </div>

      <div id="astral-agent-list" class="astral-agent-list" role="list" aria-label="Agents"></div>

      <div id="astral-profile" class="astral-profile">
        <img src="/static/img/user-avatar.png?v=%%ASTRAL_V:img/user-avatar.png%%" alt=""
             class="astral-profile-avatar" draggable="false" width="32" height="32">
        <span class="astral-profile-id">
          <span id="astral-profile-name" class="astral-profile-name">%%ASTRAL_USER_NAME%%</span>
          <span id="astral-profile-role" class="astral-profile-role">%%ASTRAL_USER_ROLE%%</span>
        </span>
        <header id="astral-topbar" class="astral-topbar">%%ASTRAL_TOPBAR%%</header>
      </div>
    </aside>

    <div id="astral-main" class="astral-main">
      <header id="astral-response-top-nav" class="response-top-nav">
        <button type="button" id="astral-back-dash-btn" class="btn-back-dash" title="Return to Dashboard">
          <span aria-hidden="true">&larr;</span> <span>%%CONSOLE:dashboard%%<span class="astral-desktop-label">%%CONSOLE:dashboard_suffix%%</span></span>
        </button>
        <div class="response-query-chip">
          <button type="button" id="astral-turns-chip" class="astral-turns-chip" disabled>(0 turns)</button>
        </div>
        <div class="response-top-nav-right">
          <button type="button" id="astral-top-newchat-btn" class="btn-new-chat" title="Start New Conversation" aria-label="New chat">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>%%CONSOLE:new_chat%%</span>
          </button>
        </div>
      </header>

      <section id="astral-canvas" data-tour-target="canvas.workspace" class="astral-canvas-panel">
        <div id="astral-landing" class="astral-landing">
          <div class="astral-page-header">
            <div class="astral-page-title-block">
              <h1 class="astral-page-title">%%CONSOLE:title%%</h1>
              <p class="astral-page-subtitle">%%CONSOLE:subtitle%%</p>
            </div>
          </div>

          <section id="astral-scenarios" class="astral-scenarios">
            <div class="astral-scenarios-head">
              <div class="astral-scenarios-title">%%CONSOLE:start_here%%</div>
              <div class="astral-filter-tabs" role="tablist" aria-label="Filter examples"></div>
            </div>
            <div id="astral-scenario-grid" class="astral-scenario-grid"></div>
          </section>

          <div id="astral-start-intro" class="astral-start-slot" hidden></div>
          <div id="astral-start-permission" class="astral-start-slot" hidden></div>
          <div id="astral-start-examples" class="astral-start-slot" hidden></div>
          <div id="astral-start-more" class="astral-start-slot" hidden></div>
        </div>

        <div id="astral-canvas-empty" class="astral-canvas-empty" hidden>
          <div class="astral-canvas-empty-glyph" aria-hidden="true">✦</div>
          <p class="astral-canvas-empty-title">%%CONSOLE:empty_title%%</p>
          <p class="astral-canvas-empty-sub">%%CONSOLE:empty_subtitle%%</p>
        </div>

        <div id="astral-chat" class="astral-feed"></div>
      </section>

      <div id="astral-composer" class="astral-composer">
        <form id="astral-form" class="astral-chat-form">
          <div id="astral-conn" class="astral-conn" hidden data-conn="connecting">
            <span class="astral-conn-dot" aria-hidden="true"></span>
            <span id="astral-conn-text" role="status" aria-live="polite">Connecting…</span>
          </div>
          <div id="astral-turn-status" class="astral-turn-status" role="status" aria-live="polite" aria-atomic="true" hidden></div>
          <div id="astral-attachments" class="astral-attachments hidden flex flex-wrap gap-1.5"></div>
          <div id="astral-selection" class="astral-selection hidden" hidden>
            <span class="astral-chip is-selection">
              <span id="astral-selection-summary" class="astral-chip-name" role="status" aria-live="polite"></span>
              <button type="button" id="astral-selection-clear" class="astral-chip-remove" aria-label="Clear the selection for this chat"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
            </span>
          </div>
          <!-- Discovery only: the server expands a /command into a normal prompt through the usual gates -->
          <div id="astral-slash-menu" class="astral-slash-menu hidden" role="listbox" aria-label="Slash commands"></div>
          <div class="astral-composer-row">
            <textarea id="astral-input" rows="1" autocomplete="off" aria-label="Message" placeholder="%%CONSOLE:message_placeholder%%" data-tour-target="chat.input"
                      class="astral-field"></textarea>

            <button type="button" id="astral-attach-btn" class="astral-attach-btn" title="%%CONSOLE:attach%%" aria-label="%%CONSOLE:attach%%" data-tour-target="chat.attach">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            </button>
            <input id="astral-attach-input" type="file" multiple class="astral-file-upload hidden" accept="%%ASTRAL_ACCEPT%%" aria-hidden="true" tabindex="-1">

            <div id="astral-voice-controls" class="astral-voice-controls" role="group"
                 aria-label="Voice conversation controls"><button type="button" class="astral-voice-control" data-voice-key="voice-start" data-voice-action="voice_session_start" data-icon="microphone" data-default="1" disabled aria-pressed="false" aria-busy="false" aria-label="Start voice conversation" title="Checking voice availability…"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"></path></svg><span class="astral-sr-only">Start voice conversation</span></button></div>

            <div class="astral-composer-menu-anchor" id="astral-composer-menu-anchor">
              <button type="button" id="astral-composer-more" class="astral-attach-btn astral-composer-more"
                      aria-haspopup="menu" aria-expanded="false" aria-controls="astral-composer-controls"
                      aria-label="%%CONSOLE:more%%" title="%%CONSOLE:more%%">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor"></circle><circle cx="12" cy="12" r="1.6" fill="currentColor"></circle><circle cx="19" cy="12" r="1.6" fill="currentColor"></circle></svg>
              </button>
              <div id="astral-composer-controls" class="astral-composer-controls astral-composer-menu" role="menu">
                <button type="button" id="astral-bg-btn" class="astral-composer-menu-item" role="menuitem" aria-pressed="false"
                        title="%%CONSOLE:background%% - keep using other chats; you will be notified when it finishes."
                        aria-label="%%CONSOLE:background%%">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                  <span class="astral-menu-item-text">%%CONSOLE:background%%</span>
                </button>
                <button type="button" id="astral-advanced-btn" class="astral-composer-menu-item astral-advanced-btn" role="menuitem"
                        aria-haspopup="dialog" aria-label="%%CONSOLE:advanced%%"
                        title="Advanced: choose the agent, skills and private notes for this chat"
                        data-ui-action="chrome_open" data-ui-payload='{"surface":"guidance","params":{"view":"selection"}}'>
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line><circle cx="9" cy="6" r="2" fill="currentColor"></circle><circle cx="15" cy="12" r="2" fill="currentColor"></circle><circle cx="7" cy="18" r="2" fill="currentColor"></circle></svg>
                  <span class="astral-menu-item-text">%%CONSOLE:advanced%%</span>
                </button>
                <button type="button" id="astral-timeline-btn" class="astral-composer-menu-item" role="menuitem" data-tour-target="topbar.timeline"
                        aria-haspopup="dialog" aria-label="Workspace timeline"
                        title="Workspace timeline: view canvas history for this chat"
                        data-ui-action="chrome_open" data-ui-payload='{"surface":"workspace_timeline"}'>
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 8 14"></polyline><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                  <span class="astral-menu-item-text">Workspace timeline</span>
                </button>
                <button type="button" id="astral-pulse-btn" class="astral-composer-menu-item" role="menuitem"
                        aria-haspopup="dialog" aria-label="Pulse digest"
                        title="Pulse digest: view proactive summary and insights"
                        data-ui-action="chrome_open" data-ui-payload='{"surface":"pulse"}'>
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6.4-4.8-6.4 4.8 2.4-7.2-6-4.8h7.6z"/></svg>
                  <span class="astral-menu-item-text">Pulse digest</span>
                </button>
              </div>
            </div>

            <button type="button" id="astral-chat-toggle" class="astral-attach-btn astral-chat-toggle"
                    aria-expanded="false" aria-controls="astral-chat" title="Show conversation" aria-label="Show conversation">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              <span id="astral-chat-unread" class="astral-chat-unread" hidden>0</span>
            </button>
            <button type="button" id="astral-restore-chat-btn" hidden
                    class="astral-attach-btn" aria-controls="astral-chat"
                    title="Move conversation to the right sidebar" aria-label="Move conversation to the right sidebar">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M15 3v18M6 12h6m-3-3 3 3-3 3"></path></svg>
            </button>

            <button type="submit" id="astral-send-btn" class="astral-btn astral-btn-primary astral-send-btn" aria-label="%%CONSOLE:send%%" title="%%CONSOLE:send%%">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7"/></svg>
            </button>
          </div>
          <!-- Voice feedback stays textual and live so no state relies on color alone -->
          <div id="astral-voice-feedback" class="astral-voice-feedback" hidden data-state="off" data-reason="ready">
            <div class="astral-voice-state-line">
              <span class="astral-voice-state-label" aria-hidden="true"></span>
              <span id="astral-voice-status" role="status" aria-live="polite" aria-atomic="true"></span>
            </div>
            <div id="astral-voice-transcript" class="astral-voice-transcript" aria-live="polite" aria-atomic="true"></div>
            <button id="astral-voice-audio-resume" class="astral-voice-audio-resume" type="button" hidden>
              Enable voice audio
            </button>
            <button id="astral-voice-local-install" class="astral-voice-audio-resume" type="button"
                    aria-describedby="astral-voice-status" hidden>
              Install local speech
            </button>
          </div>
          <div id="astral-voice-turn-notice" class="astral-voice-turn-notice" role="alert"
               aria-live="assertive" aria-atomic="true" hidden>
            <span class="astral-voice-turn-notice-icon" aria-hidden="true">!</span>
            <div class="astral-voice-turn-notice-copy">
              <strong id="astral-voice-turn-notice-title" class="astral-voice-turn-notice-title"></strong>
              <span id="astral-voice-turn-notice-message" class="astral-voice-turn-notice-message" hidden></span>
              <span id="astral-voice-turn-notice-guidance" class="astral-voice-turn-notice-fallback">Typed chat remains available.</span>
            </div>
          </div>
          <div id="astral-voice-audio" hidden aria-hidden="true"></div>
        </form>
      </div>

      <button type="button" id="astral-msgs-toggle" class="astral-msgs-toggle" hidden
              aria-expanded="false" aria-controls="astral-chat"><span id="astral-msgs-label">Messages</span></button>
      <button type="button" id="astral-collapse-btn" class="astral-rail-collapse" hidden
              title="Hide the chat panel (canvas full width)" aria-label="Hide the chat panel">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="13 17 18 12 13 7"></polyline><polyline points="6 17 11 12 6 7"></polyline></svg>
      </button>
    </div>
  </div>

  <div id="astral-fullscreen" class="astral-fullscreen" role="dialog" aria-modal="true"
       aria-labelledby="astral-fs-title" hidden>
    <div class="astral-fs-header">
      <div class="astral-fs-header-left">
        <span class="astral-fs-icon" aria-hidden="true">✦</span>
        <div>
          <div class="astral-fs-title-row">
            <span id="astral-fs-title" class="astral-fs-title">Workspace</span>
            <span class="astral-badge astral-badge-accent">Full screen</span>
          </div>
          <div id="astral-fs-sub" class="astral-fs-sub"></div>
        </div>
      </div>
      <div id="astral-fs-actions" class="astral-fs-actions"></div>
      <button type="button" id="astral-fs-exit" class="astral-fs-exit" aria-label="Exit full screen" title="Exit full screen">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
        <span class="astral-desktop-label">Exit full screen</span><span class="astral-fs-kbd">Esc</span>
      </button>
    </div>
    <div id="astral-fs-canvas" class="astral-fs-canvas"></div>
  </div>

  <div id="astral-modal"></div>
  <!-- client.js injects LiveKit on first voice need, so a page that never uses voice never loads it -->
  <script src="/static/canvas-export.js?v=%%ASTRAL_V:canvas-export.js%%"></script>
  <script src="/static/client.js?v=%%ASTRAL_V:client.js%%"></script>
</body>
</html>
