name: AstralProjection CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check --status
          tar --extract --gzip --file "$archive" gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan complete history
        run: gitleaks git --redact --log-opts="--all"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r tooling/python-ci/requirements.lock.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: ruff check src backend tests scripts windows-client
      - name: Record test and qualification changes for maintainer review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python scripts/ci_review_diagnostics.py --base "$BASE_SHA" --head "$HEAD_SHA"
          --output build/ci/review-diagnostics.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: projection-review-diagnostics
          path: build/ci/review-diagnostics.json
          if-no-files-found: error
      - run: mkdir -p build/074/coverage
      - run: python -m pytest -q -p no:cacheprovider --cov=astralprojection --cov=rote --cov=webrender --cov=scripts.merge_xccov_line_coverage --cov=scripts.build_offline_assets --cov=scripts.build_native_export --cov=scripts.android_coverage --cov=scripts.native_xccov_domain --cov=scripts.collect_xccov_native_domain --cov=scripts.export_xccov_line_coverage --cov=scripts.check_changed_coverage --cov=scripts.ci_review_diagnostics --cov=scripts.ci_lanes --cov=scripts.ci_retry_diagnostics --cov=scripts.check_regression_effectiveness --cov=scripts.swift_inactive_input --cov-branch --cov-report=xml:build/074/coverage/projection-python.xml
      - name: Prove focused regression effectiveness
        run: python scripts/check_regression_effectiveness.py
      - name: Record changed Python coverage for the event range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python scripts/check_changed_coverage.py build/074/coverage/projection-python.xml
          --base-sha "$BASE_SHA" --fail-under=90
          --output build/074/coverage/projection-python-changed-coverage.json
      - run: PIP_CONSTRAINT=tooling/python-ci/requirements.lock.txt python -m build --no-isolation
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl && python -c "import astralprojection, rote, webrender"

      - name: Retain Python coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: projection-python-coverage
          path: |
            build/074/coverage/projection-python.xml
            build/074/coverage/projection-python-changed-coverage.json
            .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Render persistent assignment browser fixtures from shared views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/079/browser-fixtures
          for mode in create revise detail expired error; do
            python tooling/web-ci/fixtures/persistent-agents-079.py "$mode" > "build/079/browser-fixtures/$mode.json"
          done
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tooling/web-ci/package-lock.json
      - working-directory: tooling/web-ci
        run: test "$(corepack npm --version)" = "11.16.0" && corepack npm ci --ignore-scripts
      - name: Install the wheel for external panel browser qualification
        run: |
          python -m pip install --require-hashes -r tooling/python-ci/requirements.lock.txt
          PIP_CONSTRAINT=tooling/python-ci/requirements.lock.txt python -m build --no-isolation
          python - <<'PY'
          from pathlib import Path
          import zipfile
          wheels = list(Path("dist").glob("astralprojection-*.whl"))
          assert len(wheels) == 1
          with zipfile.ZipFile(wheels[0]) as archive:
              archive.extractall("build/panel-wheel")
          PY
      - name: Run host checks with native coverage
        working-directory: tooling/web-ci
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/build/coverage/javascript/node-v8
        run: corepack npm run check:package-manager && corepack npm run check:product-isolation && corepack npm run lint && corepack npm run test:coverage-conversion && corepack npm run test:coverage-conversion:node && corepack npm run test:coverage-union
      - name: Verify public offline worker and changed JavaScript coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/088/offline-v8
          NODE_V8_COVERAGE="$GITHUB_WORKSPACE/build/088/offline-v8" \
            node --test tooling/web-ci/tests/offline-worker-088.test.mjs
          node tooling/web-ci/coverage-conversion-cli.mjs \
            --node-v8-directory build/088/offline-v8 --repo-root "$GITHUB_WORKSPACE" \
            --output build/088/offline-javascript.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/088/offline-javascript.json").read_text())
          for name in ("service-worker.js", "offline-registration.js"):
              counts = list(report["coverage"][f"backend/webrender/static/{name}"]["s"].values())
              assert counts and sum(count > 0 for count in counts) / len(counts) >= .90, name
          PY
      - name: Run browser checks in the pinned Playwright image
        shell: bash
        run: |
          set -euo pipefail
          image="$(tr -d '\r\n' < tooling/web-ci/playwright-image.txt)"
          test -n "$image"
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env ASTRAL_PANEL_WHEEL_DIR=/workspace/build/panel-wheel \
            --env ASTRAL_PANEL_COVERAGE_OUTPUT=/workspace/build/coverage/chatgpt-panel.json \
            --env ASTRAL_ASSIGNMENT_FIXTURE_DIR=/workspace/build/079/browser-fixtures \
            --env ASTRAL_EXPORT_COVERAGE_OUTPUT=/workspace/build/088/export-javascript.json \
            --env ASTRAL_ALL_CLIENT_COVERAGE_DIR=/workspace/build/coverage/javascript/browser-v8/client \
            --env ASTRAL_MESH_COVERAGE_OUTPUT=/workspace/build/coverage/javascript/browser-v8/mesh.json \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/tooling/web-ci \
            "$image" \
            /bin/bash -lc 'corepack npm run test:coverage-conversion:browser && node --test tests/mesh-custody.browser.test.mjs && corepack npm exec -- playwright test tests/mesh-enrollment.spec.js tests/continuity-contract-060.spec.js tests/voice-conversation-065.spec.js tests/persistent-agents-079.spec.js tests/offline-worker-088.spec.js tests/canvas-review-088.spec.js tests/native-export-088.spec.js tests/work-reads-088.spec.js tests/guidance-notes-088.spec.js tests/workspace-topbar-088.spec.js tests/native-chart-088.spec.js tests/first-task-088.spec.js tests/selection-088.spec.js tests/chatgpt-panel.spec.js --browser=chromium --workers=1'
      - name: Enforce external panel executable-line coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/coverage/chatgpt-panel.json").read_text())
          counts = list(report["coverage"]["backend/webrender/static/chatgpt-panel.js"]["s"].values())
          assert counts and sum(count > 0 for count in counts) / len(counts) >= .90
          PY
      - name: Enforce portable export executable-line coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/088/export-javascript.json").read_text())
          for name in ("canvas-export.js", "canvas-export-host.js"):
              counts = list(report["coverage"][f"backend/webrender/static/{name}"]["s"].values())
              assert counts and sum(count > 0 for count in counts) / len(counts) >= .90, name
          PY

      - name: Collect exact-source JavaScript coverage
        shell: bash
        env:
          NODE_V8_COVERAGE: ${{ github.workspace }}/build/coverage/javascript/node-v8
        run: |
          set -euo pipefail
          mkdir -p build/coverage/javascript
          python - <<'PYTHON'
          from pathlib import Path
          import subprocess
          paths = sorted(Path("build/coverage/javascript/browser-v8").rglob("*.json"))
          if not paths:
              raise SystemExit("browser coverage observations are missing")
          subprocess.run(["node", "tooling/web-ci/browser-v8-cli.mjs", "--repo-root", str(Path.cwd()),
                          "--output", "build/coverage/javascript/browser.json",
                          *[value for path in paths for value in ("--input", str(path))]], check=True)
          PYTHON
          node tooling/web-ci/coverage-conversion-cli.mjs \
            --node-v8-directory build/coverage/javascript/node-v8 --repo-root "$GITHUB_WORKSPACE" \
            --output build/coverage/javascript/node.json
          node tooling/web-ci/coverage-union-cli.mjs \
            --node build/coverage/javascript/node.json --browser build/coverage/javascript/browser.json \
            --offline-node build/088/offline-javascript.json --export-browser build/088/export-javascript.json \
            --repo-root "$GITHUB_WORKSPACE" --output build/coverage/javascript/javascript.json
      - name: Retain JavaScript coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: projection-javascript-coverage
          path: |
            build/coverage/javascript/
            build/088/offline-javascript.json
            build/088/export-javascript.json
          if-no-files-found: error
          retention-days: 7

  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install the locked Windows release runtime
        run: python -m pip install --require-hashes -r windows-client/requirements-release.lock.txt
      - name: Install locked CI tooling and Projection package
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r tooling/python-ci/requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows source tests with changed-line coverage
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: windows-client
          PYTEST_ADDOPTS: -o faulthandler_timeout=60
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -m pytest windows-client\tests -q -p no:cacheprovider --durations=25 `
            --cov=astral_client --cov=win_agent --cov-branch `
            --cov-report=xml:build\075\coverage\windows-python.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts\check_changed_coverage.py build\075\coverage\windows-python.xml `
            --base-sha "$env:BASE_SHA" --fail-under=90 `
            --output build\075\coverage\windows-python-changed-coverage.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain Windows Python coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: projection-windows-python-coverage
          path: |
            build/075/coverage/windows-python.xml
            build/075/coverage/windows-python-changed-coverage.json
            .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.400"
      - name: Verify the exact native SDK
        shell: pwsh
        run: |
          if ((dotnet --version).Trim() -ne "10.0.400") {
            throw "unexpected .NET SDK"
          }
      - name: Install the locked Windows release runtime
        run: python -m pip install --require-hashes -r windows-client/requirements-release.lock.txt
      - name: Restore the native helper from its exact lock
        run: dotnet restore windows-client\asr-helper\tests\AstralSpeechHelper.Tests.csproj --locked-mode
      - name: Verify native helper formatting
        shell: pwsh
        run: |
          dotnet format windows-client\asr-helper\AstralSpeechHelper.csproj `
            --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet format windows-client\asr-helper\tests\AstralSpeechHelper.Tests.csproj `
            --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the native helper and isolated tests
        run: >-
          dotnet build windows-client\asr-helper\tests\AstralSpeechHelper.Tests.csproj
          --configuration Release --no-restore
      - name: Test the deterministic native helper with Cobertura
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\075\coverage\windows-csharp-raw | Out-Null
          dotnet test windows-client\asr-helper\tests\AstralSpeechHelper.Tests.csproj `
            --configuration Release --no-restore --no-build `
            --filter "TestCategory!=HostCapability" `
            --settings windows-client\asr-helper\tests\coverage.runsettings `
            --collect:"Code Coverage" `
            --results-directory build\075\coverage\windows-csharp-raw `
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reports = @(Get-ChildItem build\075\coverage\windows-csharp-raw `
            -Recurse -Filter '*.cobertura.xml')
          if ($reports.Count -ne 1) {
            throw "expected exactly one C# Cobertura report"
          }
          Copy-Item $reports[0].FullName build\075\coverage\windows-csharp.xml
      - name: Probe installed en-US SAPI capability
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $supported = @(
            [System.Speech.Recognition.SpeechRecognitionEngine]::InstalledRecognizers() |
              Where-Object {
                $_.Culture.Name -eq 'en-US' -and @(
                  $_.SupportedAudioFormats | Where-Object {
                    $_.SamplesPerSecond -eq 16000 -and
                    $_.BitsPerSample -eq 16 -and
                    $_.ChannelCount -eq 1
                  }
                ).Count -gt 0
              }
          ).Count -gt 0
          if (-not $supported) {
            Write-Host "Windows runner is typed-only: no installed en-US 16-kHz recognizer"
            exit 0
          }
          dotnet test windows-client\asr-helper\tests\AstralSpeechHelper.Tests.csproj `
            --configuration Release --no-restore --no-build `
            --filter "TestCategory=HostCapability"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish deterministic helper and verify provenance
        shell: pwsh
        run: |
          $publish = 'windows-client\asr-helper\publish'
          $allowed = @(
            'AstralSpeechHelper.exe',
            'AstralSpeechHelper.exe.config',
            'AstralSpeechHelper.pdb',
            'helper-build-provenance.json'
          ) | Sort-Object

          function Get-VerifiedHelperHash([string] $directory) {
            $actual = @(Get-ChildItem $directory -File | ForEach-Object Name | Sort-Object)
            if (($actual -join "`n") -ne ($allowed -join "`n")) {
              throw "helper publish allowlist mismatch: $($actual -join ', ')"
            }
            $provenance = Get-Content "$directory\helper-build-provenance.json" -Raw |
              ConvertFrom-Json
            $keys = @($provenance.PSObject.Properties.Name | Sort-Object)
            if (($keys -join ',') -ne 'executable_sha256,schema_version,source_manifest_sha256' -or
                $provenance.schema_version -ne 1) {
              throw "helper provenance shape is invalid"
            }
            foreach ($value in @(
              $provenance.source_manifest_sha256,
              $provenance.executable_sha256
            )) {
              if ($value -cnotmatch '^[0-9A-Fa-f]{64}$') {
                throw "helper provenance digest is invalid"
              }
            }
            $sourceHash = (Get-FileHash `
              windows-client\asr-helper\helper-source-hashes.json -Algorithm SHA256).Hash
            $executableHash = (Get-FileHash `
              "$directory\AstralSpeechHelper.exe" -Algorithm SHA256).Hash
            if ($provenance.source_manifest_sha256.ToLowerInvariant() -ne
                $sourceHash.ToLowerInvariant() -or
                $provenance.executable_sha256.ToLowerInvariant() -ne
                $executableHash.ToLowerInvariant()) {
              throw "helper provenance does not match its inputs"
            }
            return $executableHash
          }

          if (Test-Path -LiteralPath $publish) {
            Remove-Item -LiteralPath $publish -Recurse -Force
          }
          dotnet clean windows-client\asr-helper\AstralSpeechHelper.csproj `
            --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish windows-client\asr-helper\AstralSpeechHelper.csproj `
            --configuration Release --no-restore --output $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $firstHash = Get-VerifiedHelperHash $publish

          Remove-Item -LiteralPath $publish -Recurse -Force
          dotnet clean windows-client\asr-helper\AstralSpeechHelper.csproj `
            --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish windows-client\asr-helper\AstralSpeechHelper.csproj `
            --configuration Release --no-restore --output $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $secondHash = Get-VerifiedHelperHash $publish
          if ($firstHash -ne $secondHash) {
            throw "helper publish is not byte reproducible"
          }
      - name: Freeze the release-only Windows executable
        working-directory: windows-client
        run: python -m PyInstaller --noconfirm --clean AstralDeep.spec
      - name: Install locked CI tooling and Projection package
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r tooling/python-ci/requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enforce changed native helper coverage
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python scripts/check_changed_coverage.py build/075/coverage/windows-csharp.xml
          --base-sha "$env:BASE_SHA" --fail-under=90
          --output build/075/coverage/windows-csharp-changed-coverage.json
      - name: Run actual frozen Windows package smokes
        shell: pwsh
        env:
          ASTRAL_WINDOWS_EXE: ${{ github.workspace }}\windows-client\dist\AstralDeep.exe
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: windows-client
        run: |
          python -m pytest `
            windows-client\tests\test_packaged_release.py `
            windows-client\tests\test_helper_integrity_075.py `
            -q -p no:cacheprovider -k "not test_actual_frozen_gui_retains_selected_profile_during_offline_retry"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            python -m pytest `
              windows-client\tests\test_packaged_release.py::test_actual_frozen_gui_retains_selected_profile_during_offline_retry `
              -q -p no:cacheprovider
            if ($LASTEXITCODE -eq 0) {
              $disposition = if ($attempt -eq 1) { 'first attempt passed' } else { 'passed after retry' }
              Add-Content $env:GITHUB_STEP_SUMMARY "Windows frozen smoke: $disposition (attempt $attempt)"
              exit 0
            }
          }
          exit $LASTEXITCODE

      - name: Retain Windows native coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: projection-windows-native-coverage
          path: |
            build/075/coverage/windows-csharp.xml
            build/075/coverage/windows-csharp-changed-coverage.json
            build/075/coverage/windows-csharp-raw/
          if-no-files-found: error
          retention-days: 7

  required:
    if: always()
    needs: [python, web, windows-tests, windows-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every owner gate
        shell: bash
        run: |
          [[ '${{ needs.python.result }}' == 'success' ]]
          [[ '${{ needs.web.result }}' == 'success' ]]
          [[ '${{ needs.windows-tests.result }}' == 'success' ]]
          [[ '${{ needs.windows-package.result }}' == 'success' ]]
