# Feature 060 — non-waivable Apple lint, coverage, continuity, and first-login gates.
name: apple-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR branch cancels the previous 8-job macos-26 fleet
# instead of running both to completion (mirrors ci.yml; pushes to main never
# cancel each other).
concurrency:
  group: apple-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_VERSION: "26.6"
  XCODE_BUILD: "17F113"
  IOS_RUNTIME: "26.5"
  WATCHOS_RUNTIME: "26.5"
  APP_PROJECT: apple-clients/AstralApp/AstralApp.xcodeproj
  COVERAGE_ROOT: build/060/coverage

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      android: ${{ steps.classify.outputs.android }}
      apple: ${{ steps.classify.outputs.apple }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - name: Classify the immutable event range
        id: classify
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/ci_lanes.py --base "$BASE_SHA" --head "$HEAD_SHA"
          --output build/ci/native-lanes.json --github-output "$GITHUB_OUTPUT"

  swift-lint:
    needs: [changes]
    if: needs.changes.outputs.apple == 'true'
    name: Required · strict recursive swift-format
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select exact Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.6*.app /Applications/Xcode.app; do
            [[ -d "$candidate" ]] || continue
            if [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]] && \
               [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo "Xcode ${XCODE_VERSION} (${XCODE_BUILD}) is required" >&2; exit 1; }
          sudo xcode-select --switch "$selected/Contents/Developer"
          [[ "$(xcodebuild -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]]
          [[ "$(xcodebuild -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]
      - name: Lint every maintained Swift source
        run: >-
          xcrun swift-format lint --strict --recursive
          --configuration apple-clients/.swift-format
          apple-clients/AstralCore apple-clients/AstralApp apple-clients/AstralWatch
          scripts/WholeOSInputProof.swift

  core-tests:
    needs: [changes]
    if: needs.changes.outputs.apple == 'true'
    name: Required · AstralCore tests and drift guard
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select exact Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.6*.app /Applications/Xcode.app; do
            [[ -d "$candidate" ]] || continue
            if [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]] && \
               [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo "Xcode ${XCODE_VERSION} (${XCODE_BUILD}) is required" >&2; exit 1; }
          sudo xcode-select --switch "$selected/Contents/Developer"
          [[ "$(xcodebuild -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]]
          [[ "$(xcodebuild -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]
      - name: Set up helper test Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install locked helper test requirements
        run: python -m pip install --require-hashes -r tooling/python-ci/requirements.lock.txt
      - name: Qualify standalone whole-source compiler helper
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
          COVERAGE_FILE: ${{ github.workspace }}/build/099/swift-inactive-input/python.coverage
        run: |
          set -euo pipefail
          [[ "$(xcodebuild -version)" == $'Xcode 26.6\nBuild version 17F113' ]]
          evidence="$PWD/build/099/swift-inactive-input"
          rm -rf "$evidence"
          mkdir -p "$evidence"
          chmod 700 "$evidence"
          python -m pytest tests/test_swift_inactive_input.py tests/test_swift_inactive_input_native.py \
            -q -p no:cacheprovider --basetemp="$evidence/pytest" \
            --junitxml="$evidence/junit.xml" \
            --cov=scripts.swift_inactive_input --cov-branch \
            --cov-report=xml:"$evidence/helper-python.xml" \
            --cov-report=json:"$evidence/helper-python.json" \
            2>&1 | tee "$evidence/pytest.log"
      - name: Retain standalone compiler helper raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: astral-swift-inactive-input-tool-evidence
          path: |
            build/099/swift-inactive-input/pytest/
            build/099/swift-inactive-input/pytest.log
            build/099/swift-inactive-input/junit.xml
            build/099/swift-inactive-input/helper-python.xml
            build/099/swift-inactive-input/helper-python.json
            build/099/swift-inactive-input/python.coverage
          if-no-files-found: error
          retention-days: 14
      - name: Validate App Store icon assets
        run: python3 apple-clients/Scripts/generate_app_icons.py --check
      - name: Run AstralCore with coverage
        run: swift test --package-path apple-clients/AstralCore --enable-code-coverage
      - name: Stage SwiftPM coverage data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${COVERAGE_ROOT}/astralcore-codecov"
          # `.build/debug` is a symlink into `.build/<triple>/debug`, which
          # upload-artifact will not traverse; resolve the real bin path and
          # copy the codecov payload (profdata + test binary) to a flat dir.
          bin="$(swift build --package-path apple-clients/AstralCore --show-bin-path)"
          if [[ -d "$bin/codecov" ]]; then
            cp -R "$bin/codecov/." "${COVERAGE_ROOT}/astralcore-codecov/"
          fi
          find "${COVERAGE_ROOT}/astralcore-codecov" -type f | head
      - name: Upload SwiftPM coverage data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: astralcore-swiftpm-coverage
          path: ${{ env.COVERAGE_ROOT }}/astralcore-codecov/**
          if-no-files-found: error
          retention-days: 14

  core-ios-tests:
    needs: [changes]
    if: needs.changes.outputs.apple == 'true'
    name: Required · actual iOS AstralCore coverage
    runs-on: macos-26
    timeout-minutes: 16
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select exact Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.6*.app /Applications/Xcode.app; do
            [[ -d "$candidate" ]] || continue
            if [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]] && \
               [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo "Xcode ${XCODE_VERSION} (${XCODE_BUILD}) is required" >&2; exit 1; }
          sudo xcode-select --switch "$selected/Contents/Developer"
          [[ "$(xcodebuild -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]]
          [[ "$(xcodebuild -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]
      - name: Run AstralCore on the supported iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          runtime_id="$(xcrun simctl list runtimes available -j | python3 -c "import json,sys,os; print(next(r['identifier'] for r in json.load(sys.stdin)['runtimes'] if r.get('isAvailable') and r.get('version')==os.environ['IOS_RUNTIME'] and 'simruntime.ios' in r.get('identifier','').lower()))")"
          udid="$(xcrun simctl create "astral-ios-core-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "iPhone 17 Pro" "$runtime_id")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          root="$PWD"
          result="$root/${COVERAGE_ROOT}/AstralCore-ios.xcresult"
          report="$root/${COVERAGE_ROOT}/apple-ios-core-xccov.json"
          mkdir -p "${COVERAGE_ROOT}"
          if [ -e "$result" ] || [ -L "$result" ]; then
            echo "::error::result bundle $result already exists"
            exit 1
          fi
          core_args=(-scheme AstralCore -destination "platform=iOS Simulator,id=$udid"
            -configuration Debug CODE_SIGNING_ALLOWED=NO -enableCodeCoverage YES
            -derivedDataPath "$root/build/060/core-ios-dd" -only-testing:AstralCoreTests)
          (cd apple-clients/AstralCore && xcodebuild "${core_args[@]}" build-for-testing)
          set +e
          (cd apple-clients/AstralCore && xcodebuild "${core_args[@]}" \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath "$result" test-without-building)
          status=$?
          set -e
          if [[ "$status" -eq 0 && -d "$result" ]]; then
            domain="$root/${COVERAGE_ROOT}/apple-ios-core-domain.json"
            python3 scripts/collect_xccov_native_domain.py --repo "$root" \
              --products "$root/build/060/core-ios-dd/Build/Products" --xcresult "$result" --lane core \
              --output "$domain" --binary-archive "$root/${COVERAGE_ROOT}/native-binaries/apple-ios-core.zip"
            python3 scripts/export_xccov_line_coverage.py --repo "$root" \
              --xcresult "$result" --platform ios --native-domain "$domain" --output "$report"
          fi
          exit "$status"
      - name: Retain actual iOS Core observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-ios-core-coverage
          path: |
            build/060/coverage/AstralCore-ios.xcresult
            build/060/coverage/apple-ios-core-xccov.json
            build/060/coverage/apple-ios-core-domain.json
            build/060/coverage/apple-ios-core-domain.json.diagnostics/summary.stdout
            build/060/coverage/apple-ios-core-domain.json.diagnostics/summary.stderr
            build/060/coverage/apple-ios-core-domain.json.diagnostics/summary.status.json
            build/060/coverage/apple-ios-core-domain.json.diagnostics/tests.stdout
            build/060/coverage/apple-ios-core-domain.json.diagnostics/tests.stderr
            build/060/coverage/apple-ios-core-domain.json.diagnostics/tests.status.json
            build/060/coverage/apple-ios-core-domain.json.diagnostics/stage.json
            build/060/coverage/native-binaries/apple-ios-core.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish required iOS Core coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-required-core-ios-coverage
          path: build/060/coverage/apple-ios-core-xccov.json
          if-no-files-found: error
          retention-days: 1
      - name: Disclose per-test retry outcomes
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -d "$COVERAGE_ROOT" ]]; then
            for result in "$COVERAGE_ROOT"/*.xcresult; do
              [[ -d "$result" ]] || continue
              xcrun xcresulttool get test-results tests --path "$result" --compact \
                > "$result-retry-input.json" || printf '{}' > "$result-retry-input.json"
              python3 scripts/ci_retry_diagnostics.py --input "$result-retry-input.json" \
                --output "$result-retry-diagnostics.json" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

  app-unit-tests:
    needs: [changes]
    if: needs.changes.outputs.apple == 'true'
    name: Required · ${{ matrix.name }} app continuity/unit coverage
    runs-on: macos-26
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS 26.5
            slug: ios
            destination: "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5"
          - name: macOS
            slug: macos
            destination: "platform=macOS"
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select exact Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.6*.app /Applications/Xcode.app; do
            [[ -d "$candidate" ]] || continue
            if [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]] && \
               [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo "Xcode ${XCODE_VERSION} (${XCODE_BUILD}) is required" >&2; exit 1; }
          sudo xcode-select --switch "$selected/Contents/Developer"
          [[ "$(xcodebuild -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]]
          [[ "$(xcodebuild -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]
      - name: Require the supported iOS runtime
        if: matrix.slug == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes available | grep -F "iOS ${IOS_RUNTIME}"
          xcrun simctl list devicetypes | grep -F "iPhone 17 Pro"
      - name: Run app unit and continuity tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${COVERAGE_ROOT}"
          result="${COVERAGE_ROOT}/AstralApp-${{ matrix.slug }}-unit.xcresult"
          report="${COVERAGE_ROOT}/apple-${{ matrix.slug }}-unit-xccov.json"
          rm -rf "$result"
          rm -f "$report"
          derived="$PWD/build/060/app-${{ matrix.slug }}-unit-dd"
          test_action='test'
          xcodebuild -project "${APP_PROJECT}" -scheme AstralApp \
            -destination '${{ matrix.destination }}' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -enableCodeCoverage YES -derivedDataPath "$derived" \
            build-for-testing
          test_action=test-without-building
          set +e
          xcodebuild \
            -project "${APP_PROJECT}" \
            -scheme AstralApp \
            -destination '${{ matrix.destination }}' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -enableCodeCoverage YES \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -derivedDataPath "$derived" \
            -resultBundlePath "$result" \
            -only-testing:AstralAppTests \
            "$test_action"
          status=$?
          set -e
          if [[ -d "$result" ]]; then
            test "$status" -eq 0
            domain="${COVERAGE_ROOT}/apple-${{ matrix.slug }}-unit-domain.json"
            python3 scripts/collect_xccov_native_domain.py --repo "$PWD" \
              --platform '${{ matrix.slug }}' \
              --products "$derived/Build/Products" --xcresult "$PWD/$result" --lane unit \
              --output "$PWD/$domain" --binary-archive "$PWD/${COVERAGE_ROOT}/native-binaries/apple-${{ matrix.slug }}-unit.zip"
            native_args=(--native-domain "$domain")
            python3 scripts/export_xccov_line_coverage.py \
              ${native_args[@]+"${native_args[@]}"} \
              --repo "$PWD" \
              --xcresult "$result" \
              --platform '${{ matrix.slug }}' \
              --output "$report"
          fi
          exit "$status"
      - name: Upload mapped app unit coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-${{ matrix.slug }}-unit-coverage
          path: |
            build/060/coverage/AstralApp-${{ matrix.slug }}-unit.xcresult
            build/060/coverage/apple-${{ matrix.slug }}-unit-xccov.json
            build/060/coverage/apple-${{ matrix.slug }}-unit-domain.json
            build/060/coverage/apple-${{ matrix.slug }}-unit-domain.json.diagnostics/summary.stdout
            build/060/coverage/apple-${{ matrix.slug }}-unit-domain.json.diagnostics/summary.stderr
            build/060/coverage/apple-${{ matrix.slug }}-unit-domain.json.diagnostics/summary.status.json
            build/060/coverage/apple-${{ matrix.slug }}-unit-domain.json.diagnostics/tests.stdout
            build/060/coverage/apple-${{ matrix.slug }}-unit-domain.json.diagnostics/tests.stderr
            build/060/coverage/apple-${{ matrix.slug }}-unit-domain.json.diagnostics/tests.status.json
            build/060/coverage/apple-${{ matrix.slug }}-unit-domain.json.diagnostics/stage.json
            build/060/coverage/native-binaries/apple-${{ matrix.slug }}-unit.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish normalized app unit coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-required-app-unit-${{ matrix.slug }}-coverage
          path: build/060/coverage/apple-${{ matrix.slug }}-unit-xccov.json
          if-no-files-found: error
          retention-days: 1
      - name: Stage app unit success marker
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/apple-required"
          printf '%s\n' '${{ matrix.slug }}' > "${RUNNER_TEMP}/apple-required/app-unit-${{ matrix.slug }}.ok"
      - name: Publish app unit success marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-required-app-unit-${{ matrix.slug }}
          path: ${{ runner.temp }}/apple-required/app-unit-${{ matrix.slug }}.ok
          if-no-files-found: error
          retention-days: 1
      - name: Disclose per-test retry outcomes
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -d "$COVERAGE_ROOT" ]]; then
            for result in "$COVERAGE_ROOT"/*.xcresult; do
              [[ -d "$result" ]] || continue
              xcrun xcresulttool get test-results tests --path "$result" --compact \
                > "$result-retry-input.json" || printf '{}' > "$result-retry-input.json"
              python3 scripts/ci_retry_diagnostics.py --input "$result-retry-input.json" \
                --output "$result-retry-diagnostics.json" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

  first-login-ui:
    needs: [changes]
    if: needs.changes.outputs.apple == 'true'
    name: Required · ${{ matrix.name }} first-login and voice UI
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS 26.5
            slug: ios
            destination: "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5"
          - name: macOS
            slug: macos
            destination: "platform=macOS"
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select exact Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.6*.app /Applications/Xcode.app; do
            [[ -d "$candidate" ]] || continue
            if [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]] && \
               [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo "Xcode ${XCODE_VERSION} (${XCODE_BUILD}) is required" >&2; exit 1; }
          sudo xcode-select --switch "$selected/Contents/Developer"
          [[ "$(xcodebuild -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]]
          [[ "$(xcodebuild -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]
      - name: Require the supported iOS runtime
        if: matrix.slug == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes available | grep -F "iOS ${IOS_RUNTIME}"
          xcrun simctl list devicetypes | grep -F "iPhone 17 Pro"
      # Hosted macos-26 images may ship zero, one, or several pre-created
      # "iPhone 17 Pro" devices with stale state; a name+OS destination is
      # ambiguous, and a cold or stale device makes the suite's FIRST
      # app.launch() absorb a full boot (observed launch timeouts and
      # AX-snapshot flapping across six runs). Same deterministic
      # device-by-UDID pattern that fixed the watch lane.
      - name: Provision a dedicated iOS simulator
        if: matrix.slug == 'ios'
        id: ios_sim
        shell: bash
        run: |
          set -euo pipefail
          runtime_id="$(xcrun simctl list runtimes available -j \
            | python3 -c "import json,sys,os; rt=os.environ['IOS_RUNTIME']; print(next(r['identifier'] for r in json.load(sys.stdin)['runtimes'] if r.get('isAvailable') and r.get('version')==rt and 'simruntime.ios' in r.get('identifier','').lower()))")"
          [[ -n "$runtime_id" ]] || { echo "iOS ${IOS_RUNTIME} runtime not found" >&2; exit 1; }
          xcrun simctl delete "astral-ios-060-first-login" 2>/dev/null || true
          udid="$(xcrun simctl create "astral-ios-060-first-login" "iPhone 17 Pro" "$runtime_id")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run deterministic first-login, voice and workspace UI tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${COVERAGE_ROOT}"
          result="${COVERAGE_ROOT}/AstralApp-${{ matrix.slug }}-first-login.xcresult"
          report="${COVERAGE_ROOT}/apple-${{ matrix.slug }}-first-login-xccov.json"
          rm -f "$report"
          if [ -e "$result" ] || [ -L "$result" ]; then
            echo "::error::result bundle $result already exists"
            exit 1
          fi
          dest='${{ matrix.destination }}'
          if [[ "${{ matrix.slug }}" == "ios" ]]; then
            dest="platform=iOS Simulator,id=${{ steps.ios_sim.outputs.udid }}"
          fi
          workspace_actions=()
          if [[ "${{ matrix.slug }}" == "ios" ]]; then
            workspace_actions=(
              -only-testing:AstralAppUITests/WorkspaceActionsUITests
              -only-testing:AstralAppUITests/SettingsControlsUITests
            )
          fi
          derived="$PWD/build/060/app-${{ matrix.slug }}-ui-dd"
          test_action='test'
          xcodebuild -project "${APP_PROJECT}" -scheme AstralApp -destination "$dest" \
            -configuration Debug CODE_SIGNING_ALLOWED=NO -enableCodeCoverage YES \
            -derivedDataPath "$derived" build-for-testing
          test_action=test-without-building
          set +e
          xcodebuild \
            -project "${APP_PROJECT}" \
            -scheme AstralApp \
            -destination "$dest" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -enableCodeCoverage YES \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -derivedDataPath "$derived" \
            -resultBundlePath "$result" \
            -only-testing:AstralAppUITests/LLMFirstLoginUITests \
            -only-testing:AstralAppUITests/VoiceConversationUITests \
            -only-testing:AstralAppUITests/Accessibility060UITests \
            -only-testing:AstralAppUITests/WorkspacePresentationUITests \
            ${workspace_actions[@]+"${workspace_actions[@]}"} \
            -only-testing:AstralAppUITests/ConversationContinuityUITests/testDeterministicProcessRelaunchRestoresSemanticConversation \
            "$test_action"
          status=$?
          set -e
          if [[ -d "$result" ]]; then
            test "$status" -eq 0
            domain="${COVERAGE_ROOT}/apple-${{ matrix.slug }}-ui-domain.json"
            python3 scripts/collect_xccov_native_domain.py --repo "$PWD" \
              --platform '${{ matrix.slug }}' \
              --products "$derived/Build/Products" --xcresult "$PWD/$result" --lane ui \
              --output "$PWD/$domain" --binary-archive "$PWD/${COVERAGE_ROOT}/native-binaries/apple-${{ matrix.slug }}-ui.zip"
            native_args=(--native-domain "$domain")
            python3 scripts/export_xccov_line_coverage.py \
              ${native_args[@]+"${native_args[@]}"} \
              --repo "$PWD" \
              --xcresult "$result" \
              --platform '${{ matrix.slug }}' \
              --output "$report"
          fi
          exit "$status"
      - name: Upload mapped first-login coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-${{ matrix.slug }}-first-login-coverage
          path: |
            build/060/coverage/AstralApp-${{ matrix.slug }}-first-login.xcresult
            build/060/coverage/apple-${{ matrix.slug }}-first-login-xccov.json
            build/060/coverage/apple-${{ matrix.slug }}-ui-domain.json
            build/060/coverage/apple-${{ matrix.slug }}-ui-domain.json.diagnostics/summary.stdout
            build/060/coverage/apple-${{ matrix.slug }}-ui-domain.json.diagnostics/summary.stderr
            build/060/coverage/apple-${{ matrix.slug }}-ui-domain.json.diagnostics/summary.status.json
            build/060/coverage/apple-${{ matrix.slug }}-ui-domain.json.diagnostics/tests.stdout
            build/060/coverage/apple-${{ matrix.slug }}-ui-domain.json.diagnostics/tests.stderr
            build/060/coverage/apple-${{ matrix.slug }}-ui-domain.json.diagnostics/tests.status.json
            build/060/coverage/apple-${{ matrix.slug }}-ui-domain.json.diagnostics/stage.json
            build/060/coverage/native-binaries/apple-${{ matrix.slug }}-ui.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish normalized first-login coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-required-first-login-${{ matrix.slug }}-coverage
          path: build/060/coverage/apple-${{ matrix.slug }}-first-login-xccov.json
          if-no-files-found: error
          retention-days: 1
      - name: Stage first-login success marker
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/apple-required"
          printf '%s\n' '${{ matrix.slug }}' > "${RUNNER_TEMP}/apple-required/first-login-${{ matrix.slug }}.ok"
      - name: Publish first-login success marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-required-first-login-${{ matrix.slug }}
          path: ${{ runner.temp }}/apple-required/first-login-${{ matrix.slug }}.ok
          if-no-files-found: error
          retention-days: 1
      - name: Disclose per-test retry outcomes
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -d "$COVERAGE_ROOT" ]]; then
            for result in "$COVERAGE_ROOT"/*.xcresult; do
              [[ -d "$result" ]] || continue
              xcrun xcresulttool get test-results tests --path "$result" --compact \
                > "$result-retry-input.json" || printf '{}' > "$result-retry-input.json"
              python3 scripts/ci_retry_diagnostics.py --input "$result-retry-input.json" \
                --output "$result-retry-diagnostics.json" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

  watch-continuity:
    needs: [changes]
    if: needs.changes.outputs.apple == 'true'
    name: Required · watchOS 26.5 continuity coverage
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select exact Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected=""
          for candidate in /Applications/Xcode_26.6.app /Applications/Xcode_26.6*.app /Applications/Xcode.app; do
            [[ -d "$candidate" ]] || continue
            if [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]] && \
               [[ "$("$candidate/Contents/Developer/usr/bin/xcodebuild" -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]; then
              selected="$candidate"
              break
            fi
          done
          [[ -n "$selected" ]] || { echo "Xcode ${XCODE_VERSION} (${XCODE_BUILD}) is required" >&2; exit 1; }
          sudo xcode-select --switch "$selected/Contents/Developer"
          [[ "$(xcodebuild -version | sed -n '1p')" == "Xcode ${XCODE_VERSION}" ]]
          [[ "$(xcodebuild -version | sed -n '2p')" == "Build version ${XCODE_BUILD}" ]]
      - name: Provision a dedicated watchOS simulator
        id: watch_sim
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes available | grep -F "watchOS ${WATCHOS_RUNTIME}"
          xcrun simctl list devicetypes | grep -F "Apple Watch Series 11 (46mm)"
          # Hosted macos-26 images may ship zero, one, or several pre-created
          # "Apple Watch Series 11 (46mm)" devices, so a name+OS destination is
          # ambiguous. Create one dedicated device and target it by exact UDID.
          # There is both an iOS 26.5 and a watchOS 26.5 runtime; select the
          # watchOS one explicitly or `simctl create` fails "Incompatible
          # device" (403) when a Watch device type lands on an iOS runtime.
          runtime_id="$(xcrun simctl list runtimes available -j \
            | python3 -c "import json,sys,os; rt=os.environ['WATCHOS_RUNTIME']; print(next(r['identifier'] for r in json.load(sys.stdin)['runtimes'] if r.get('isAvailable') and r.get('version')==rt and 'watchos' in r.get('identifier','').lower()))")"
          [[ -n "$runtime_id" ]] || { echo "watchOS ${WATCHOS_RUNTIME} runtime not found" >&2; exit 1; }
          xcrun simctl delete "astral-watch-060" 2>/dev/null || true
          udid="$(xcrun simctl create "astral-watch-060" "Apple Watch Series 11 (46mm)" "$runtime_id")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run Watch continuity and navigation with coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${COVERAGE_ROOT}"
          result="${COVERAGE_ROOT}/AstralWatch.xcresult"
          unit_result="${COVERAGE_ROOT}/AstralWatch-unit.xcresult"
          navigation_result="${COVERAGE_ROOT}/AstralWatch-navigation.xcresult"
          report="${COVERAGE_ROOT}/apple-watchos-xccov.json"
          rm -rf "$result" "$unit_result" "$navigation_result"
          rm -f "$report"
          set +e
          xcodebuild \
            -project "${APP_PROJECT}" \
            -scheme AstralWatch \
            -destination "platform=watchOS Simulator,id=${{ steps.watch_sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -enableCodeCoverage YES \
            -resultBundlePath "$unit_result" \
            -only-testing:AstralWatchTests \
            test
          unit_status=$?
          xcodebuild \
            -project "${APP_PROJECT}" \
            -scheme AstralWatchNavigation \
            -destination "platform=watchOS Simulator,id=${{ steps.watch_sim.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -enableCodeCoverage YES \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath "$navigation_result" \
            -only-testing:AstralWatchNavigationUITests \
            test
          navigation_status=$?
          set -e
          test "$unit_status" -eq 0
          test "$navigation_status" -eq 0
          xcrun xcresulttool merge --output-path "$result" "$unit_result" "$navigation_result"
          python3 scripts/export_xccov_line_coverage.py \
            --repo "$PWD" \
            --xcresult "$result" \
            --platform watchos \
            --output "$report"
      - name: Upload mapped Watch coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-watchos-continuity-coverage
          path: |
            build/060/coverage/AstralWatch.xcresult
            build/060/coverage/AstralWatch-unit.xcresult
            build/060/coverage/AstralWatch-navigation.xcresult
            build/060/coverage/apple-watchos-xccov.json
          if-no-files-found: error
          retention-days: 14
      - name: Disclose per-test retry outcomes
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -d "$COVERAGE_ROOT" ]]; then
            for result in "$COVERAGE_ROOT"/*.xcresult; do
              [[ -d "$result" ]] || continue
              xcrun xcresulttool get test-results tests --path "$result" --compact \
                > "$result-retry-input.json" || printf '{}' > "$result-retry-input.json"
              python3 scripts/ci_retry_diagnostics.py --input "$result-retry-input.json" \
                --output "$result-retry-diagnostics.json" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

  apple-required:
    name: Required · Apple aggregate
    if: ${{ always() }}
    # Marker downloads + shell checks only — no macOS toolchain needed, and
    # ubuntu starts faster than a 10x-billed macos-26 runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - swift-lint
      - core-tests
      - core-ios-tests
      - app-unit-tests
      - first-login-ui
      - watch-continuity
    steps:
      - name: Check out candidate for source-bound coverage union
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enforce applicability and every Apple result
        shell: bash
        run: |
          [[ '${{ needs.changes.result }}' == 'success' ]]
          python3 scripts/ci_lanes.py --applicable '${{ needs.changes.outputs.apple }}' \
            --results '${{ needs.swift-lint.result }}' '${{ needs.core-tests.result }}' '${{ needs.core-ios-tests.result }}' '${{ needs.app-unit-tests.result }}' '${{ needs.first-login-ui.result }}' '${{ needs.watch-continuity.result }}' >> "$GITHUB_STEP_SUMMARY"
      # `needs.<matrix-job>.result` can report the result of only one matrix
      # child. Requiring one current-run artifact from every child prevents a
      # later successful sibling from hiding a failed platform.
      - name: Require iOS app-unit success
        if: needs.changes.outputs.apple == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-required-app-unit-ios
          path: ${{ runner.temp }}/apple-required/app-unit-ios
      - name: Require macOS app-unit success
        if: needs.changes.outputs.apple == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-required-app-unit-macos
          path: ${{ runner.temp }}/apple-required/app-unit-macos
      - name: Require iOS first-login success
        if: needs.changes.outputs.apple == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-required-first-login-ios
          path: ${{ runner.temp }}/apple-required/first-login-ios
      - name: Require macOS first-login success
        if: needs.changes.outputs.apple == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-required-first-login-macos
          path: ${{ runner.temp }}/apple-required/first-login-macos
      - name: Download iOS app-unit coverage
        if: needs.changes.outputs.apple == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-required-app-unit-ios-coverage
          path: ${{ github.workspace }}/build/060/coverage/union-inputs/ios/unit
      - name: Download iOS first-login coverage
        if: needs.changes.outputs.apple == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-required-first-login-ios-coverage
          path: ${{ github.workspace }}/build/060/coverage/union-inputs/ios/ui
      - name: Download macOS app-unit coverage
        if: needs.changes.outputs.apple == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-required-app-unit-macos-coverage
          path: ${{ github.workspace }}/build/060/coverage/union-inputs/macos/unit
      - name: Download macOS first-login coverage
        if: needs.changes.outputs.apple == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-required-first-login-macos-coverage
          path: ${{ github.workspace }}/build/060/coverage/union-inputs/macos/ui
      - name: Download actual iOS Core coverage
        if: needs.changes.outputs.apple == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apple-required-core-ios-coverage
          path: ${{ github.workspace }}/build/060/coverage/union-inputs/ios/core
      - name: Union required unit and UI coverage by platform
        if: needs.changes.outputs.apple == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${COVERAGE_ROOT}"
          python3 scripts/merge_xccov_line_coverage.py \
            --repo "${GITHUB_WORKSPACE}" \
            --platform ios --profile ci \
            --core-input "${GITHUB_WORKSPACE}/build/060/coverage/union-inputs/ios/core/apple-ios-core-xccov.json" \
            --unit-input "${GITHUB_WORKSPACE}/build/060/coverage/union-inputs/ios/unit/apple-ios-unit-xccov.json" \
            --ui-input "${GITHUB_WORKSPACE}/build/060/coverage/union-inputs/ios/ui/apple-ios-first-login-xccov.json" \
            --output "${COVERAGE_ROOT}/apple-ios-xccov.json"
          python3 scripts/merge_xccov_line_coverage.py \
            --repo "${GITHUB_WORKSPACE}" \
            --platform macos \
            --unit-input "${GITHUB_WORKSPACE}/build/060/coverage/union-inputs/macos/unit/apple-macos-unit-xccov.json" \
            --ui-input "${GITHUB_WORKSPACE}/build/060/coverage/union-inputs/macos/ui/apple-macos-first-login-xccov.json" \
            --output "${COVERAGE_ROOT}/apple-macos-xccov.json"
      - name: Publish platform coverage unions
        if: needs.changes.outputs.apple == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-required-platform-union-coverage
          path: |
            build/060/coverage/apple-ios-xccov.json
            build/060/coverage/apple-macos-xccov.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce every non-waivable Apple result
        if: needs.changes.outputs.apple == 'true'
        shell: bash
        run: |
          [[ '${{ needs.swift-lint.result }}' == 'success' ]]
          [[ '${{ needs.core-tests.result }}' == 'success' ]]
          [[ '${{ needs.core-ios-tests.result }}' == 'success' ]]
          [[ '${{ needs.app-unit-tests.result }}' == 'success' ]]
          [[ '${{ needs.first-login-ui.result }}' == 'success' ]]
          [[ '${{ needs.watch-continuity.result }}' == 'success' ]]
