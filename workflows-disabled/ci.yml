name: AstralProjection CI (inactive until local qualification)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and verify
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
          python -m build
          python -c "import astralprojection"
          ruff check src backend tests
          pytest -q
