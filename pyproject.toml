[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "astralprojection"
version = "0.1.0"
description = "Presentation, rendering, adaptation, and native clients for AstralDeep"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["astralprims==0.3.0"]
authors = [{ name = "AstralDeep" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/AstralDeep/AstralProjection"
Issues = "https://github.com/AstralDeep/AstralProjection/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff==0.15.21",
]

[tool.setuptools.packages.find]
where = ["src", "backend", "."]
include = ["astralprojection*", "webrender*", "rote*", "contracts"]
namespaces = false

[tool.setuptools.package-data]
webrender = [
  "static/**/*",
  "templates/**/*",
]
contracts = [
  "*.json",
  "fixtures/**/*.json",
]
astralprojection = ["NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "backend"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pin the repository's established gate explicitly so a future Ruff release
# cannot silently broaden CI policy during the migration checkpoint.
select = ["E4", "E7", "E9", "F"]
